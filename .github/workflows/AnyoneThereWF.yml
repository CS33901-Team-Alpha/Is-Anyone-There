name: AnyoneThereWF

on:
  workflow_dispatch:

jobs:
  example_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Get out files
        uses: actions/checkout@v4
      - name: Checkout out the VM
        run: |
          echo $ ls -la
          ls -la
          echo $ whoami
          whoami


      - name: Get the keys
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{secrets.ID_ED25519}}
          name: id_ed25519
          known_hosts: ${{secrets.KNOWN_HOSTS}}
      - name: Check out the VM
        run: |
          echo $ ls -la
          ls -la
          echo $ whoami
          whoami
      - name: Check out cassini
        run: |
          echo $RUN ls -la
          $RUN ls -la
          echo $ ssh anyonethere@cassini.cs.kent.edu ls -la
          ssh anyonethere@cassini.cs.kent.edu ls -la
          echo $  ssh anyonethere@cassini.cs.kent.edu whoami
          ssh anyonethere@cassini.cs.kent.edu whoami
          echo $  ssh anyonethere@cassini.cs.kent.edu hostname
          ssh anyonethere@cassini.cs.kent.edu hostname

          echo $ ssh anyonethere@cassini.cs.kent.edu mkdir -p ./web
          ssh anyonethere@cassini.cs.kent.edu mkdir -p ./web
          echo scp index.html anyonethere@cassini.cs.kent.edu:./web
          scp index.html anyonethere@cassini.cs.kent.edu:./web
	      

